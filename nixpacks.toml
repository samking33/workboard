# Without this, auto-detection walks the repo and can settle on frontend/,
# which is a pnpm workspace of client sources and has no start command. The
# built client is committed under frontend/dist, so nothing needs building.
providers = ['node']

[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = ['npm --prefix server install --omit=dev']

[phases.build]
# The web client is committed already built, so the only step is making sure the
# schema exists. Idempotent: creates it on a fresh database, no-op otherwise.
cmds = ['npm --prefix server run db:init']

[start]
cmd = 'node server/src/index.js'
