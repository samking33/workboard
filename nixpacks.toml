# Without this, auto-detection walks the repo and can settle on desktop/
# (an Electron app) or frontend/ (a pnpm workspace). Neither serves the site.
providers = ['node']

[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = ['npm --prefix server install --omit=dev']

[phases.build]
# Nothing to build: the web client is committed already built.
cmds = ['echo "no build step required"']

[start]
cmd = 'node server/src/index.js'
